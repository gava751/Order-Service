spring:
  profiles:
    default: local

  application:
    name: order-service

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/master.yaml

server:
  port: ${SERVER_PORT:8083}

app:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
  services:
    user-url: ${USER_SERVICE_URL:http://localhost:8082}
    connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${USER_SERVICE_READ_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
